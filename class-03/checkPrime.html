<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>素数か？</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>汝、素数たるや？</h1>
    <div class="input-row">
      <input type="text" id="numberInput" placeholder="数字や数式を入力" aria-label="判定したい数字や数式">
      <button type="button" id="checkButton">チェック</button>
    </div>
    <p id="result" class="result-normal" aria-live="polite">ここに結果を表示</p>
    <!-- 【追加】コレクション・Achievementの表示エリア -->
    <div id="achievementNotice" class="achievement-notice" role="status" aria-live="polite" style="display:none"></div>
    <section class="dashboard" aria-label="素数コレクションと実績">
      <section class="panel" aria-labelledby="collectionTitle">
        <div class="panel-header">
          <h2 id="collectionTitle">MY PRIME COLLECTION</h2>
          <span class="count-label">発見数：<strong id="collectionCount">0</strong></span>
        </div>
        <p id="collectionEmpty" class="muted">まだ素数がありません。最初の素数を探そう！</p>
        <ul id="primeList" class="prime-list" aria-label="発見済みの素数"></ul>
        <button type="button" id="resetCollection" class="reset-button">コレクションをリセット</button>
        <p id="collectionStatus" class="muted" role="status"></p>
      </section>
      <section class="panel" aria-labelledby="achievementTitle">
        <h2 id="achievementTitle">ACHIEVEMENTS</h2>
        <ul id="achievementList" class="achievement-list"></ul>
      </section>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
